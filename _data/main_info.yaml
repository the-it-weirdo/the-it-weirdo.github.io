bio: <p>Hello, I’m a Software Engineer with a passion for building technology that connects people and systems in smarter, more secure ways. My research interests sit at the intersection of applied Artificial Intelligence, Human-Computer Interaction, Computer Vision, and Cybersecurity.</p> <p>I earned my M.S. in Computer Science from Missouri State University, and today I develop mobile software at Digital Monitoring Products, where we create security solutions for homes and businesses. I enjoy exploring how AI can make everyday interactions more accessible, intuitive and reliable.</p>
